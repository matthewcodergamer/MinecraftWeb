name: Sync Java 26.1 assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sync_prismarine_26_1_assets.py'
      - '.github/workflows/sync-java-26-1-assets.yml'
  schedule:
    - cron: '17 5 * * 1'
concurrency:
  group: java-26-1-asset-sync
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mirror complete PrismarineJS Java 26.1 asset tree
        run: python tools/sync_prismarine_26_1_assets.py
      - name: Cache Java Edition game icon when Minecraft.net is reachable
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p assets/branding
          timeout 10s curl --http1.1 -A 'Mozilla/5.0' -L --fail --connect-timeout 4 --max-time 8 \
            'https://www.minecraft.net/content/dam/minecraftnet/games/minecraft/logos/icon_javaedition.jpg' \
            -o assets/branding/icon_javaedition.jpg || rm -f assets/branding/icon_javaedition.jpg
      - name: Commit synchronized assets
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/java/26.1
          if [ -f assets/branding/icon_javaedition.jpg ]; then git add assets/branding/icon_javaedition.jpg; fi
          if git diff --cached --quiet; then
            echo 'No Java asset changes.'
          else
            git commit -m 'assets: sync complete PrismarineJS Minecraft Java 26.1 tree'
            git push
          fi
