name: Build Java Runtime Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/java-runtime-profile.json'
      - 'tools/build_java_runtime_assets.py'
      - '94*.js'
      - '95*.js'

permissions:
  contents: write

jobs:
  build-java-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Java-first browser assets
        run: python tools/build_java_runtime_assets.py
      - name: Commit generated Java runtime cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/java
          if git diff --cached --quiet; then
            echo 'Java runtime cache already current.'
          else
            git commit -m 'Build Java runtime assets [skip ci]'
            git push
          fi
