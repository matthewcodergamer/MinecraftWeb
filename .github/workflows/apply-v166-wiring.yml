name: Apply V16.6 release wiring

on:
  push:
    paths:
      - '.github/workflows/apply-v166-wiring.yml'

permissions:
  contents: write

jobs:
  wire-v166:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify new V16.6 sources
        run: |
          node --check 119-v16-6-ender-dragon.js
          node --check 120-v16-6-advancements.js
          node --check 121-v16-6-lan-multiplayer.js
          python -m json.tool assets/java/data/advancements-v166.json >/dev/null

      - name: Wire V16.6 loader, entrypoint, manifest and README
        shell: python
        run: |
          from pathlib import Path
          import json

          loader=Path('runtime-loader.js')
          s=loader.read_text()
          s=s.replace("const RUNTIME_BUILD_ID='0.16.5.1';", "const RUNTIME_BUILD_ID='0.16.6';")
          old="'118-v16-5-1-stability-guard.js'"
          new="'118-v16-5-1-stability-guard.js','119-v16-6-ender-dragon.js','120-v16-6-advancements.js','121-v16-6-lan-multiplayer.js'"
          if old not in s:
              raise SystemExit('runtime-loader source anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('0.16.5.1','0.16.6').replace('V16.5.1','V16.6').replace('minecraft-v16-5-1-source-fallback.js','minecraft-v16-6-source-fallback.js')
          loader.write_text(s)

          index=Path('index.html')
          s=index.read_text().replace('0.16.5.1','0.16.6').replace('V16.5.1','V16.6')
          index.write_text(s)

          manifest=Path('manifest.webmanifest')
          d=json.loads(manifest.read_text())
          d['description']='Minecraft Web V16.6 — Ender Dragon boss, Java-style advancements, local WebRTC LAN multiplayer, 384-block world, worker generation/meshing, fluids, lighting, AI, dimensions and weather'
          d['start_url']='./?source=pwa&v=0.16.6'
          for icon in d.get('icons',[]):
              icon['src']=icon.get('src','').split('?')[0]+'?v=0.16.6'
          manifest.write_text(json.dumps(d,indent=2)+'\n')

          readme=Path('README.md')
          r=readme.read_text()
          r=r.replace('# Minecraft Web V16.5.1 — Player Render + Kinematics Hotfix','# Minecraft Web V16.6 — Ender Dragon + Advancements + LAN',1)
          r=r.replace('The current production build is **0.16.5.1**','The current production build is **0.16.6**',1)
          r=r.replace('The V16.5.1 browser entrypoint, loader, PWA cache keys and runtime bundle are all on **0.16.5.1**.','The V16.6 browser entrypoint, loader and PWA cache keys are on **0.16.6**. The cached runtime bundle is regenerated by CI from the ordered numbered source parts.',1)
          section='''\n## V16.6 Ender Dragon, Advancements and LAN multiplayer\n\nV16.6 adds three larger gameplay/runtime systems while keeping the V16.5/V16.5.1 world, rendering and compatibility layers intact. The production source order adds `119-v16-6-ender-dragon.js`, `120-v16-6-advancements.js` and `121-v16-6-lan-multiplayer.js`.\n\n### Ender Dragon boss\n\n- Uses the local Java 26.1 Ender Dragon, eye, fireball, End Crystal and crystal-beam textures already stored in the repository.\n- Builds the dragon as a multipart hierarchy of torso, head/jaw, linked neck segments, linked tail segments, two-segment wings and legs rather than one giant collision mesh.\n- Uses procedural forward kinematics: sinusoidal two-stage wing flaps plus a bounded history buffer that bends neck and tail segments behind the torso heading.\n- Uses split AABB hit regions with different damage multipliers instead of mesh-level collision.\n- Adds a phase state machine with circle, strafe, charge, landing, perch, takeoff and death phases.\n- Adds dragon fireballs, contact damage, a 200-HP boss bar, death particles/audio and the existing XP system reward path.\n- Adds eight End Crystals around the central End island, actual obsidian tower blocks, crystal explosion damage and healing beams. A living crystal within 32 blocks heals the dragon once per second.\n- Dragon defeat is persisted per world seed in local storage so returning to the same browser world does not silently respawn the first dragon.\n- The implementation is an independent Three.js recreation of the architecture; it does not copy Mojang Java source.\n\n### Java-style Advancements\n\n- `assets/java/data/advancements-v166.json` is the data registry. The first production registry contains **36 browser-reachable/core progression nodes** across Minecraft, Nether, The End, Adventure and Husbandry.\n- The engine indexes listeners only for incomplete advancements and evaluates event criteria for inventory changes, crafting, mining, entity kills, dimension entry, End Crystal destruction, Dragon defeat, biome visits and travel distance.\n- Progress is world-specific and stored by seed, including completion timestamps, counters, visited biomes, unique defeated entity types and travel totals.\n- XP rewards are routed into the existing V12 experience system.\n- Press **L** on keyboard or **ADV** on touch devices to open the Java-style five-tab advancement tree. The tree uses the local Java 26.1 advancement window, tab/background and obtained/unobtained frame assets, supports drag-panning, locked-node presentation and hover/tap tooltips.\n- Completion toasts slide in at the top-right and use the Java audio event path, including the challenge-complete sound where available.\n- This is now a data-driven advancement runtime; adding the remaining vanilla/data-pack criteria is a data/trigger expansion rather than another UI rewrite. It is not a claim that every current vanilla Java advancement trigger is already emulated.\n\n### Browser LAN multiplayer\n\n- The title-screen **Multiplayer** button and in-game **LAN** button now open a real pairing panel instead of the old “not available” toast.\n- The transport is an ordered, reliable WebRTC DataChannel using **local ICE only** (`iceServers: []`). Browsers do not expose arbitrary UDP LAN discovery, so pairing uses a one-time host offer / joiner answer code rather than pretending Java's multicast discovery is available.\n- The host is authoritative for the accepted remote-player position and validates movement envelopes/collision before accepting client coordinates. Rejected movement receives a correction packet.\n- The joining browser keeps immediate client-side prediction for its own controls, then reconciles toward host-confirmed coordinates.\n- Network snapshots run at **20 ticks per second** and remote players are smoothed with interpolation through the existing `PlayerEntityRendererV12` remote-avatar pipeline.\n- The host sends the deterministic world seed, current dimension and changed-block journal. Player break/place edits are validated by reach and replicated to the peer. Dimension changes initiated by the host are also replicated.\n- Ping/pong timing is exposed in the LAN panel and the `lan` diagnostic command.\n- Each peer still renders its own chunks/entities using its own renderer, frustum/LOD settings and device GPU. LAN does not stream rendered frames.\n- V16.6 LAN is currently a **two-browser host + one remote client foundation**. Full multiplayer inventory/container authority, PvP reconciliation, mob authority, multi-peer rooms, automatic service discovery and internet relay/signaling remain later networking work.\n\nDiagnostics: `dragon`, `advancements` and `lan` report the three V16.6 subsystem states.\n'''
          anchor='\n## V16.5.1 player/render/kinematics hotfix\n'
          if anchor not in r:
              raise SystemExit('README insertion anchor missing')
          r=r.replace(anchor,section+anchor,1)
          r=r.replace('**Minecraft Web V16.5.1 — Player Render + Kinematics Hotfix**  \nBuild **0.16.5.1**','**Minecraft Web V16.6 — Ender Dragon + Advancements + LAN**  \nBuild **0.16.6**',1)
          readme.write_text(r)

      - name: Remove one-shot wiring workflow
        run: git rm .github/workflows/apply-v166-wiring.yml

      - name: Commit release wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime-loader.js index.html manifest.webmanifest README.md .github/workflows/apply-v166-wiring.yml
          git commit -m 'Wire Minecraft Web V16.6 release [skip ci]'
          git push
