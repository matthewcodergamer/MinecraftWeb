<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Minecraft</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minecraft">
<meta name="application-name" content="Minecraft">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.21.8/items/grass_block.png">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.21.8/items/grass_block.png">
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="stylesheet" href="./main.css">
<link rel="stylesheet" href="./v14-4-java.css">
<style id="javaBootStyleV145">
.javaBootTitleV145{display:flex;flex-direction:column;align-items:center;gap:8px}.javaBootTitleV145 #mcLogo{width:min(520px,72vw);height:auto;image-rendering:auto;margin-bottom:14px;filter:drop-shadow(0 4px #0008)}.javaBootBtnV145{width:min(400px,72vw);min-height:40px;border:0;border-radius:0;color:#fff;text-shadow:2px 2px #3f3f3f;font:700 20px/1 ui-monospace,"Courier New",monospace;background:transparent url("https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.21.8/gui/sprites/widget/button.png") center/100% 100% no-repeat;image-rendering:pixelated}.javaBootBtnV145:hover,.javaBootBtnV145:focus-visible{background-image:url("https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.21.8/gui/sprites/widget/button_highlighted.png")}.javaBootBtnV145:active{filter:brightness(.82)}.javaBootTitleV145 #titleSub{color:#ddd;text-shadow:1px 1px #222;font:12px ui-monospace,"Courier New",monospace;margin-top:5px}
</style>
</head>
<body>
<div id="app">
<canvas id="gameCanvas"></canvas>
<div id="titleScreen">
  <div id="titlePanorama"></div><div id="titleShade"></div>
  <div id="titleContent" class="javaBootTitleV145">
    <img id="mcLogo" src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.21.8/gui/title/minecraft.png" alt="Minecraft">
    <button class="javaBootBtnV145" id="playBtn">Singleplayer</button>
    <button class="javaBootBtnV145" id="creativeBtn">Creative World</button>
    <button class="javaBootBtnV145" id="resetBtn">New World</button>
    <div id="titleSub">Minecraft Web Alpha 0.14.7 • Loading Java Edition fidelity + optimized engine…</div>
  </div>
</div>
<div id="loading"><div id="loadingBar"><div id="loadingFill"></div></div><div id="loadingText">Starting V14.7 Java Edition engine…</div></div>
<div id="hud">
  <div id="lookSurface"></div><div id="crosshair"></div><div id="damageVignette"></div>
  <div id="topStatus"></div><div id="debug"></div><div id="mobileHint">drag anywhere to look • tap mobs or attack/mine button to act</div>
  <button id="voxelDiagToggle" type="button">DBG</button>
  <div id="voxelOptions">
    <div class="voxOptRow"><label><span>Texture quality ceiling</span><b id="voxelQualityValue">100%</b></label><input id="voxelQuality" type="range" min="25" max="100" step="25" value="100"></div>
    <div class="voxOptRow"><label><span>LOD near distance</span><b id="voxelLodNearValue">10</b></label><input id="voxelLodNear" type="range" min="4" max="20" step="1" value="10"></div>
    <div class="voxOptRow"><label><span>LOD far distance</span><b id="voxelLodFarValue">32</b></label><input id="voxelLodFar" type="range" min="16" max="60" step="1" value="32"></div>
  </div>
  <div id="voxelDiag"><div id="voxelDiagBar"><button class="voxBtn" id="voxelCopy" type="button">COPY</button><button class="voxBtn" id="voxelClear" type="button">CLEAR</button><button class="voxBtn" id="voxelValidate" type="button">VALIDATE</button><button class="voxBtn" id="voxelInspect" type="button">INSPECT BLOCK</button><button class="voxBtn" id="voxelTextures" type="button">TEXTURES</button><button class="voxBtn" id="voxelWorld" type="button">WORLD</button><button class="voxBtn" id="voxelExport" type="button">EXPORT</button><button class="voxBtn" id="voxelOptionsBtn" type="button">OPTIONS</button></div><div id="voxelCommandRow"><input id="voxelCommand" autocomplete="off" spellcheck="false" placeholder="help / inspect / faces / textures / chunks / uv / winding / renderer / world"><button class="voxBtn" id="voxelRunCommand" type="button">RUN</button></div><div id="voxelDiagText"></div></div>
  <div id="hotbar"></div>
  <div id="mobileControls"><div id="movePad"><div id="moveStick"></div></div><button class="actionBtn" id="jumpBtn">↑</button><button class="actionBtn" id="useBtn">▣</button><button class="actionBtn" id="breakBtn">⛏</button><button class="actionBtn" id="invBtn" aria-label="Inventory">☷</button><button class="actionBtn" id="craftBtn" aria-label="Crafting">⚒</button></div>
</div>
<div id="screenLayer"></div><div id="toast"></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js"}}</script>
<script type="module" src="./runtime-loader.js"></script>
<script>
window.__MC_BOOT_WATCHDOG__=setTimeout(function(){
  if(!window.__MC_RUNTIME_READY__){
    console.error('[BOOT] Java V14.7 source-part runtime did not finish starting. Check runtime-loader.js and the numbered source parts.');
  }
},8000);
</script>
</body>
</html>
